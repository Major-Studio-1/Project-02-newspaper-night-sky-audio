# Publish the audio/ folder with GitHub Pages (Settings → Pages → Source: "GitHub Actions").
name: Publish the radio voices

on:
  push:
    branches: [main]
    paths: ['audio/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Two jobs, as in GitHub's own Pages template and the main site's workflow. With upload and deploy in one job, the
# deploy step sometimes looked for the artifact before GitHub had listed it ("Found 0 artifact(s)", twice on 23 and
# 24 November 2026); a separate deploy job starts only after the upload job has finished.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: audio

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
